  <!-- Google tag (gtag.js) - Ultra-deferred to minimize unused JS -->
  <script>
    (function (w, d, id) {
      w.dataLayer = w.dataLayer || [];
      function gtag() { w.dataLayer.push(arguments); }
      w.gtag = gtag;
      gtag('js', new Date());
      gtag('config', id);

      let gtagLoaded = false;
      let interactionDetected = false;

      const loadGtag = () => {
        if (gtagLoaded) return;
        gtagLoaded = true;
        const script = d.createElement('script');
        script.id = 'gtag-js';
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        d.head.appendChild(script);
      };

      // Only load GTM after user interaction or after 10s
      const handleInteraction = () => {
        if (!interactionDetected) {
          interactionDetected = true;
          // Wait additional 2s after first interaction
          setTimeout(loadGtag, 2000);
        }
      };

      // Delayed loading - increased to 10s
      if ('requestIdleCallback' in w) {
        w.requestIdleCallback(loadGtag, { timeout: 10000 });
      } else {
        w.setTimeout(loadGtag, 10000);
      }

      // Load on first meaningful interaction
      ['scroll', 'click', 'keydown', 'touchstart'].forEach((evt) => {
        w.addEventListener(evt, handleInteraction, { once: true, passive: true });
      });
    })(window, document, 'G-9RM36DRDK7');
  </script>
