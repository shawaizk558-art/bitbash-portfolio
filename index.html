  <!-- Google tag (gtag.js) - Loaded after page render to avoid blocking -->
  <script>
    // Defer gtag initialization until after page load
    if (document.readyState === 'complete') {
      initGtag();
    } else {
      window.addEventListener('load', initGtag, { once: true });
    }
    
    function initGtag() {
      // Further defer until idle or after 15s
      const loadGtag = () => {
        const w = window;
        const d = document;
        const id = 'G-9RM36DRDK7';
        
        w.dataLayer = w.dataLayer || [];
        function gtag() { w.dataLayer.push(arguments); }
        w.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id);
        
        const script = d.createElement('script');
        script.id = 'gtag-js';
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        d.head.appendChild(script);
      };
      
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtag, { timeout: 15000 });
      } else {
        setTimeout(loadGtag, 15000);
      }
      
      // Load on first interaction (after page load)
      ['scroll', 'click', 'keydown', 'touchstart'].forEach((evt) => {
        window.addEventListener(evt, loadGtag, { once: true, passive: true });
      });
    }
  </script>
