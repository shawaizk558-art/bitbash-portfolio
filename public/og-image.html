<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBash OG Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
        }
        
        .logo {
            font-size: 120px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
        }
        
        .tagline {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 40px;
            text-align: center;
            opacity: 0.95;
        }
        
        .description {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            opacity: 0.9;
            max-width: 800px;
            line-height: 1.4;
        }
        
        .accent {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="logo">
        <span class="accent">Bit</span>Bash
    </div>
    
    <div class="tagline">
        Transform Your Business with Intelligent Solutions
    </div>
    
    <div class="description">
        The Complete Platform for Modern Teams and Innovators.<br>
        Trusted by 10,000+ teams worldwide.
    </div>
</body>
</html>
